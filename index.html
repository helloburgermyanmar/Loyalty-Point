<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Burger | Point System</title>
    
    <!-- Favicon (Hello Burger Logo) -->
    <link rel="icon" type="image/png" href="hello-burger-logo.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
        .burger-gradient { background: linear-gradient(135deg, #ff6700 0%, #d95800 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }
        .shake-animation { animation: shake 0.4s ease-in-out; }
        #globalLoader { position: fixed; inset: 0; background: #f3f4f6; z-index: 9999; display: flex; align-items: center; justify-content: center; transition: opacity 0.5s ease; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Global App Loader -->
    <div id="globalLoader">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-gray-300 border-t-[#ff6700]"></div>
    </div>

    <!-- 1. Secure Login Screen (Username & Password) -->
    <div id="loginScreen" class="hidden w-full max-w-sm glass-card rounded-3xl p-8 flex flex-col items-center justify-center transition-all duration-300 shadow-2xl border border-gray-100">
        <div class="w-24 h-24 mb-6 shadow-lg shadow-[#ffd400]/40 rounded-full bg-white overflow-hidden flex items-center justify-center border-4 border-[#ffd400]">
            <img src="hello-burger-logo.png" alt="Hello Burger Logo" class="w-full h-full object-contain p-1" onerror="this.src='https://placehold.co/150x150/ffd400/ff6700?text=Logo'">
        </div>
        <h1 class="text-2xl font-bold text-gray-800 mb-1">Hello Burger</h1>
        <p class="text-sm text-gray-500 mb-6 font-medium">Staff Portal (Secure Login)</p>
        
        <div class="w-full space-y-4">
            <!-- Username Input -->
            <div class="relative">
                <i class="fa-solid fa-user absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="usernameInput" placeholder="Username (e.g. 62branch)" 
                       class="w-full bg-white border border-gray-200 text-gray-800 font-medium rounded-xl py-3 pl-10 pr-4 outline-none focus:ring-2 focus:ring-[#ff6700] transition-all">
            </div>

            <!-- Password Input -->
            <div class="relative">
                <i class="fa-solid fa-lock absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                <input type="password" id="passwordInput" placeholder="Password" 
                       class="w-full bg-white border border-gray-200 text-gray-800 font-medium rounded-xl py-3 pl-10 pr-4 outline-none focus:ring-2 focus:ring-[#ff6700] transition-all">
            </div>
        </div>
        
        <button onclick="loginWithUsername()" class="w-full mt-6 burger-gradient text-white font-bold rounded-xl py-4 hover:shadow-lg hover:shadow-[#ff6700]/30 transition-all active:scale-95 flex justify-center items-center gap-2">
            <i class="fa-solid fa-right-to-bracket"></i> LOGIN
        </button>
    </div>

    <!-- 2. Main App Screen -->
    <div id="appScreen" class="hidden w-full max-w-md h-[90vh] md:h-auto flex flex-col glass-card rounded-3xl overflow-hidden shadow-2xl relative border border-gray-100">
        
        <!-- Header -->
        <div class="burger-gradient p-5 flex justify-between items-center text-white rounded-b-3xl shadow-md z-10">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center overflow-hidden border-2 border-white shadow-sm shrink-0">
                    <img src="hello-burger-logo.png" alt="Logo" class="w-full h-full object-contain p-0.5" onerror="this.src='https://placehold.co/150x150/ffd400/ff6700?text=Logo'">
                </div>
                <div>
                    <h2 class="font-bold text-lg leading-tight">Loyalty Program</h2>
                    <p class="text-xs text-[#ffd400] font-medium" id="currentUserDisplay">Logged In</p>
                </div>
            </div>
            <button onclick="logout()" class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center hover:bg-white/30 active:scale-90 transition-all" title="Logout">
                <i class="fa-solid fa-power-off text-red-100"></i>
            </button>
        </div>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto p-5 flex flex-col gap-6">
            
            <!-- Customer Search -->
            <div class="bg-gray-50 rounded-2xl p-4 border border-gray-100 shadow-inner">
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Customer Details</label>
                
                <div class="space-y-3">
                    <div class="relative">
                        <i class="fa-solid fa-phone absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input type="tel" id="phoneInput" placeholder="09xxxxxxxxx" 
                               class="w-full bg-white border border-gray-200 rounded-xl py-3 pl-10 pr-4 outline-none focus:border-[#ff6700] focus:ring-1 focus:ring-[#ff6700] transition-all font-semibold text-gray-800">
                    </div>
                    
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="nameInput" placeholder="Customer Name (Optional)" 
                               class="w-full bg-white border border-gray-200 rounded-xl py-3 pl-10 pr-4 outline-none focus:border-[#ff6700] focus:ring-1 focus:ring-[#ff6700] transition-all text-gray-800">
                    </div>
                    
                    <button onclick="loadCustomer()" class="w-full bg-gray-800 text-white font-semibold rounded-xl py-3 hover:bg-gray-700 active:scale-95 transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-magnifying-glass"></i> Check / Register
                    </button>
                    
                    <button onclick="showCustomerList()" id="btnTopCustomers" class="w-full mt-2 bg-white border border-gray-200 text-gray-700 font-semibold rounded-xl py-3 hover:bg-gray-50 active:scale-95 transition-all hidden items-center justify-center gap-2 shadow-sm">
                        <i class="fa-solid fa-users"></i> Customer စာရင်းအားလုံး ကြည့်မည် (Admin)
                    </button>

                    <button onclick="showTransactions()" id="btnTransactions" class="w-full mt-2 bg-[#ff6700]/10 border border-[#ff6700]/20 text-[#d95800] font-semibold rounded-xl py-3 hover:bg-[#ff6700]/20 active:scale-95 transition-all hidden items-center justify-center gap-2 shadow-sm">
                        <i class="fa-solid fa-clock-rotate-left"></i> Point မှတ်တမ်းများ (Admin)
                    </button>
                </div>
            </div>

            <!-- Stats & Actions (Hidden initially) -->
            <div id="statsSection" class="opacity-50 pointer-events-none transition-all duration-300">
                <div class="grid grid-cols-3 gap-3 mb-6">
                    <div class="bg-white border border-gray-100 rounded-2xl p-3 flex flex-col items-center justify-center shadow-sm">
                        <span class="text-gray-500 text-[10px] font-bold uppercase mb-1">စုစုပေါင်း</span>
                        <span id="displayTotal" class="text-gray-800 font-black text-xl">0</span>
                    </div>
                    <div class="bg-white border border-gray-100 rounded-2xl p-3 flex flex-col items-center justify-center shadow-sm">
                        <span class="text-gray-500 text-[10px] font-bold uppercase mb-1">သုံးပြီး</span>
                        <span id="displayUsed" class="text-gray-800 font-black text-xl">0</span>
                    </div>
                    <div class="bg-[#ff6700]/10 border border-[#ff6700]/20 rounded-2xl p-3 flex flex-col items-center justify-center shadow-sm">
                        <span class="text-[#d95800] text-[10px] font-bold uppercase mb-1">လက်ကျန်</span>
                        <span id="displayBalance" class="text-[#ff6700] font-black text-2xl">0</span>
                    </div>
                </div>
            </div>

            <div id="actionSection" class="space-y-4 opacity-50 pointer-events-none transition-all duration-300">
                <div class="flex gap-3">
                    <div class="relative w-1/3">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-plus text-gray-400 text-sm"></i>
                        </div>
                        <input type="number" id="addPointInput" value="1" min="1" class="w-full bg-white border border-gray-200 text-gray-800 font-bold rounded-xl py-3 pl-8 pr-3 text-center outline-none focus:border-[#16a34a] focus:ring-1 focus:ring-[#16a34a] transition-all">
                    </div>
                    <button onclick="addPoints()" class="flex-1 bg-[#16a34a] text-white font-bold rounded-xl py-3 hover:bg-[#15803d] active:scale-95 transition-all shadow-md shadow-green-500/20">
                        Point ပေါင်းမည်
                    </button>
                </div>
                
                <button onclick="usePoints()" class="w-full bg-[#ff6700] text-white font-bold rounded-xl py-4 hover:bg-[#d95800] active:scale-95 transition-all shadow-lg shadow-[#ff6700]/30 flex items-center justify-between px-6">
                    <div class="flex flex-col items-start">
                        <span class="text-lg">Cheese Burger ထုတ်မည်</span>
                        <span class="text-[10px] font-medium text-[#ffd400] flex items-center gap-1"><i class="fa-solid fa-circle-exclamation"></i> 10 Points လိုအပ်ပါသည်</span>
                    </div>
                    <i class="fa-solid fa-arrow-right bg-white/20 p-2 rounded-full"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 3. Customer List Screen -->
    <div id="listScreen" class="hidden w-full max-w-md h-[90vh] md:h-auto flex flex-col glass-card rounded-3xl overflow-hidden shadow-2xl relative border border-gray-100">
        
        <!-- Header -->
        <div class="burger-gradient p-5 flex items-center text-white rounded-b-3xl shadow-md z-10">
            <button onclick="hideCustomerList()" class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center hover:bg-white/30 active:scale-90 transition-all mr-3">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h2 class="font-bold text-lg leading-tight">Customer စာရင်း</h2>
        </div>

        <!-- Filter / Sort Options -->
        <div class="p-4 bg-gray-50 border-b border-gray-200">
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">စစ်ထုတ်ရန် ရွေးချယ်ပါ</label>
            <div class="relative">
                <select id="sortSelect" onchange="sortAndRenderList()" class="w-full bg-white border border-gray-300 text-gray-800 font-bold rounded-xl py-3 px-4 outline-none focus:ring-2 focus:ring-[#ff6700] transition-all appearance-none cursor-pointer shadow-sm">
                    <option value="totalDesc">🏆 အဝယ်အများဆုံး (Point စုစုပေါင်း)</option>
                    <option value="balanceDesc">💰 လက်ကျန် Point အများဆုံး</option>
                    <option value="noAsc">👑 ပထမဆုံး ဖောက်သည် (နံပါတ်စဉ်အလိုက်)</option>
                    <option value="noDesc">🆕 နောက်ဆုံး ဖောက်သည် (အသစ်ဆုံး)</option>
                    <option value="nameAsc">🔠 အမည်အက္ခရာစဉ် (A-Z)</option>
                </select>
                <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 pointer-events-none"></i>
            </div>
        </div>

        <!-- List Content Area -->
        <div id="customerListContent" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-100/50">
            <!-- List Items will be injected here via JS -->
        </div>
    </div>

    <!-- 4. Transactions Screen (Admin Only) -->
    <div id="transactionScreen" class="hidden w-full max-w-md h-[90vh] md:h-auto flex flex-col glass-card rounded-3xl overflow-hidden shadow-2xl relative border border-gray-100">
        
        <!-- Header -->
        <div class="burger-gradient p-5 flex items-center text-white rounded-b-3xl shadow-md z-10">
            <button onclick="hideTransactions()" class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center hover:bg-white/30 active:scale-90 transition-all mr-3">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h2 class="font-bold text-lg leading-tight">Point မှတ်တမ်းများ</h2>
        </div>

        <!-- List Content Area -->
        <div id="transactionListContent" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-100/50">
            <!-- List Items will be injected here via JS -->
        </div>
    </div>

    <!-- FIREBASE MODULAR SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs, query, orderBy, limit, increment, addDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        // 🔥 Firebase Config (Hello Burger)
        const firebaseConfig = {
            apiKey: "AIzaSyA7iX2UEEuv4AwVndL_RyLzGp7ZEy70fzg",
            authDomain: "hello-burger-point-system.firebaseapp.com",
            projectId: "hello-burger-point-system",
            storageBucket: "hello-burger-point-system.firebasestorage.app",
            messagingSenderId: "716912236933",
            appId: "1:716912236933:web:424c68852f71fa7ea94cec",
            measurementId: "G-LHKY3BVS7F"
        };

        let app, db, auth;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch (e) {
            console.error("Firebase init error:", e);
        }

        const REWARD_COST = 10;   
        let currentPhone = null;
        let currentCustomerData = null;
        let currentBranchName = ""; 
        let isAdmin = false;

        const ui = {
            globalLoader: document.getElementById('globalLoader'),
            loginScreen: document.getElementById('loginScreen'),
            appScreen: document.getElementById('appScreen'),
            listScreen: document.getElementById('listScreen'),
            transactionScreen: document.getElementById('transactionScreen'),
            usernameInput: document.getElementById('usernameInput'), 
            passwordInput: document.getElementById('passwordInput'),
            currentUserDisplay: document.getElementById('currentUserDisplay'),
            phoneInput: document.getElementById('phoneInput'),
            nameInput: document.getElementById('nameInput'),
            statsSection: document.getElementById('statsSection'),
            actionSection: document.getElementById('actionSection'),
            displayTotal: document.getElementById('displayTotal'),
            displayUsed: document.getElementById('displayUsed'),
            displayBalance: document.getElementById('displayBalance'),
            addPointInput: document.getElementById('addPointInput'),
            sortSelect: document.getElementById('sortSelect'),
            customerListContent: document.getElementById('customerListContent'),
            btnTopCustomers: document.getElementById('btnTopCustomers'),
            btnTransactions: document.getElementById('btnTransactions'),
            transactionListContent: document.getElementById('transactionListContent')
        };

        // --- AUTHENTICATION LOGIC ---
        onAuthStateChanged(auth, (user) => {
            ui.globalLoader.style.opacity = '0';
            setTimeout(() => ui.globalLoader.style.display = 'none', 500);

            if (user) {
                currentBranchName = user.email.split('@')[0]; 
                
                // Admin Check
                isAdmin = (currentBranchName === 'admin');
                
                if (isAdmin) {
                    ui.currentUserDisplay.innerText = "👑 Admin Portal";
                    ui.btnTopCustomers.classList.remove('hidden');
                    ui.btnTopCustomers.classList.add('flex');
                    ui.btnTransactions.classList.remove('hidden');
                    ui.btnTransactions.classList.add('flex');
                } else {
                    ui.currentUserDisplay.innerText = "Branch: " + currentBranchName; 
                    ui.btnTopCustomers.classList.add('hidden');
                    ui.btnTopCustomers.classList.remove('flex');
                    ui.btnTransactions.classList.add('hidden');
                    ui.btnTransactions.classList.remove('flex');
                }

                ui.loginScreen.classList.add('hidden');
                ui.appScreen.classList.remove('hidden');
                ui.phoneInput.focus();
            } else {
                ui.appScreen.classList.add('hidden');
                ui.loginScreen.classList.remove('hidden');
            }
        });

        window.loginWithUsername = async function() {
            let username = ui.usernameInput.value.replace(/\s+/g, '').toLowerCase();
            const password = ui.passwordInput.value;

            if(!username || !password) {
                ui.loginScreen.classList.add('shake-animation');
                setTimeout(() => ui.loginScreen.classList.remove('shake-animation'), 400);
                Swal.fire({ icon: 'warning', title: 'လိုအပ်ပါသည်', text: 'Username နှင့် Password ရိုက်ထည့်ပါ။', confirmButtonColor: '#ff6700' });
                return;
            }

            let email = username;
            if (!email.includes('@')) {
                email = username + '@helloburger.com';
            }

            Swal.fire({ title: 'Logging in...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

            try {
                await signInWithEmailAndPassword(auth, email, password);
                Swal.close();
                ui.usernameInput.value = '';
                ui.passwordInput.value = '';
            } catch (error) {
                ui.loginScreen.classList.add('shake-animation');
                setTimeout(() => ui.loginScreen.classList.remove('shake-animation'), 400);
                let errorMsg = 'Username သို့မဟုတ် Password မှားယွင်းနေပါသည်။';
                if(error.code === 'auth/network-request-failed') errorMsg = 'အင်တာနက်ချိတ်ဆက်မှု မရှိပါ။';
                Swal.fire({ icon: 'error', title: 'ဝင်ရောက်၍ မရပါ', text: errorMsg, confirmButtonColor: '#ff6700' });
            }
        };

        window.logout = async function() {
            Swal.fire({
                title: 'Logout ထွက်မည်',
                text: "စနစ်မှ ထွက်ရန် သေချာပါသလား?",
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#ff6700',
                cancelButtonColor: '#6b7280',
                confirmButtonText: 'ထွက်မည်'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    resetCurrentCustomer();
                    await signOut(auth);
                }
            });
        };

        ui.passwordInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') loginWithUsername(); });
        ui.usernameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') ui.passwordInput.focus(); });

        // --- APP LOGIC ---
        ui.phoneInput.addEventListener('input', function(e) {
            let formatted = this.value.replace(/[^0-9+]/g, ''); 
            if (formatted.startsWith('+959')) {
                formatted = '09' + formatted.substring(4);
            }
            this.value = formatted;
        });

        window.loadCustomer = async function() {
            if(!db) return;
            const phone = ui.phoneInput.value.replace(/[^0-9]/g, '').trim();
            const name = ui.nameInput.value.trim();

            if (!phone || phone.length < 9) {
                Swal.fire({ icon: 'warning', title: 'လိုအပ်ပါသည်', text: 'ဖုန်းနံပါတ် အပြည့်အစုံ မှန်ကန်စွာ ရိုက်ထည့်ပါ။', confirmButtonColor: '#ff6700' });
                return;
            }

            Swal.fire({ title: 'ရှာဖွေနေပါသည်...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

            try {
                const docRef = doc(db, "customers", phone);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    currentCustomerData = docSnap.data();
                    ui.nameInput.value = currentCustomerData.name;
                    Swal.close();
                } else {
                    const counterRef = doc(db, "system", "stats");
                    let counterSnap = await getDoc(counterRef);
                    let newCustomerNo = 1;

                    if (counterSnap.exists()) {
                        newCustomerNo = counterSnap.data().totalCustomers + 1;
                        await updateDoc(counterRef, { totalCustomers: newCustomerNo });
                    } else {
                        await setDoc(counterRef, { totalCustomers: 1 });
                    }

                    const now = new Date();
                    const formattedDate = now.toLocaleDateString('en-GB') + ' ' + now.toLocaleTimeString('en-US', { hour12: true });

                    currentCustomerData = { 
                        no: newCustomerNo,
                        joined_date: formattedDate,
                        phone: phone, 
                        name: name || "Customer", 
                        total: 0, 
                        used: 0, 
                        balance: 0,
                        registered_branch: currentBranchName,
                        last_visited_branch: currentBranchName
                    };
                    await setDoc(docRef, currentCustomerData);
                    
                    ui.nameInput.value = currentCustomerData.name;
                    Swal.fire({ icon: 'success', title: 'အောင်မြင်ပါသည်', text: `Customer အသစ် (No. ${newCustomerNo}) အဖြစ် မှတ်တမ်းတင်ပြီးပါပြီ။`, timer: 1500, showConfirmButton: false });
                }

                currentPhone = phone;
                updateDashboard();
                ui.statsSection.classList.remove('opacity-50', 'pointer-events-none');
                ui.actionSection.classList.remove('opacity-50', 'pointer-events-none');

            } catch (error) {
                console.error(error);
                if(error.code === 'permission-denied') {
                    Swal.fire({ icon: 'error', title: 'Access Denied', text: 'လုံခြုံရေးအရ ဝင်ရောက်ခွင့် ပိတ်ထားပါသည်။ Login အရင်ဝင်ပါ။' });
                } else {
                    Swal.fire({ icon: 'error', title: 'Error', text: 'ချိတ်ဆက်မှု ပြဿနာရှိနေပါသည်။' });
                }
            }
        };

        window.addPoints = async function() {
            if (!currentPhone || !currentCustomerData) return;
            
            const pointsToAdd = parseInt(ui.addPointInput.value);
            if (isNaN(pointsToAdd) || pointsToAdd <= 0) {
                Swal.fire({ icon: 'warning', title: 'အမှား', text: 'Point အရေအတွက် မှန်ကန်စွာရိုက်ထည့်ပါ။', confirmButtonColor: '#ff6700' });
                return;
            }

            Swal.fire({ title: 'Processing...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

            try {
                const docRef = doc(db, "customers", currentPhone);
                
                // 1. Point ပေါင်းခြင်း (Race Condition ကို Increment ဖြင့် ဖြေရှင်းထားသည်)
                await updateDoc(docRef, {
                    total: increment(pointsToAdd),
                    balance: increment(pointsToAdd),
                    last_visited_branch: currentBranchName
                });

                // 2. သမိုင်းကြောင်း မှတ်တမ်းတင်ခြင်း (Audit Log - ADD) 📝
                const now = new Date();
                await addDoc(collection(db, "transactions"), {
                    phone: currentPhone,
                    customer_name: currentCustomerData.name,
                    branch: currentBranchName,
                    action: "ADD",
                    points: pointsToAdd,
                    date: now.toLocaleDateString('en-GB') + ' ' + now.toLocaleTimeString('en-US', { hour12: true }),
                    timestamp: Date.now()
                });

                currentCustomerData.total += pointsToAdd;
                currentCustomerData.balance += pointsToAdd;
                currentCustomerData.last_visited_branch = currentBranchName;
                
                updateDashboard();
                ui.addPointInput.value = '1';

                Swal.fire({ icon: 'success', title: 'အောင်မြင်ပါသည်', text: `+${pointsToAdd} Point(s) ကိုပေါင်းထည့်ပြီးပါပြီ။`, timer: 1500, showConfirmButton: false });
            } catch (error) {
                console.error(error);
                Swal.fire({ icon: 'error', title: 'Error', text: 'Point ပေါင်းထည့်၍ မရပါ။ Login ပြန်ဝင်ကြည့်ပါ။' });
            }
        };

        window.usePoints = function() {
            if (!currentPhone || !currentCustomerData) return;
            
            if (currentCustomerData.balance < REWARD_COST) {
                Swal.fire({
                    icon: 'error',
                    title: 'Point မလောက်ပါ',
                    text: `Cheese Burger ထုတ်ရန် Point (၁၀) ခု လိုအပ်ပါသည်။ (လက်ကျန်: ${currentCustomerData.balance})`,
                    confirmButtonColor: '#ff6700'
                });
                return;
            }

            Swal.fire({
                title: 'Cheese Burger ထုတ်မည်',
                text: "10 Points နှုတ်မည်မှာ သေချာပါသလား?",
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#ff6700',
                cancelButtonColor: '#6b7280',
                confirmButtonText: 'သေချာပါသည်',
                cancelButtonText: 'မလုပ်ပါ'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    Swal.fire({ title: 'Processing...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
                    
                    try {
                        const docRef = doc(db, "customers", currentPhone);
                        
                        // 1. Point နုတ်ခြင်း
                        await updateDoc(docRef, {
                            balance: increment(-REWARD_COST),
                            used: increment(REWARD_COST),
                            last_visited_branch: currentBranchName
                        });

                        // 2. သမိုင်းကြောင်း မှတ်တမ်းတင်ခြင်း (Audit Log - USE) 📝
                        const now = new Date();
                        await addDoc(collection(db, "transactions"), {
                            phone: currentPhone,
                            customer_name: currentCustomerData.name,
                            branch: currentBranchName,
                            action: "USE",
                            points: REWARD_COST,
                            item: "Cheese Burger",
                            date: now.toLocaleDateString('en-GB') + ' ' + now.toLocaleTimeString('en-US', { hour12: true }),
                            timestamp: Date.now()
                        });

                        currentCustomerData.balance -= REWARD_COST;
                        currentCustomerData.used += REWARD_COST;
                        currentCustomerData.last_visited_branch = currentBranchName;
                        
                        updateDashboard();

                        Swal.fire({ 
                            icon: 'success', 
                            title: 'အောင်မြင်ပါသည်', 
                            text: 'Cheese Burger (1) ခု Free ပေးလိုက်ပါ။',
                            confirmButtonColor: '#16a34a',
                            backdrop: `rgba(0,0,0,0.8) url("https://media.giphy.com/media/xTiTnqUxyWbsAXq7Ju/giphy.gif") left top no-repeat` 
                        });
                    } catch(error) {
                        console.error(error);
                        Swal.fire({ icon: 'error', title: 'Error', text: 'Point နှုတ်၍ မရပါ။ Login ပြန်ဝင်ကြည့်ပါ။' });
                    }
                }
            });
        };

        function updateDashboard() {
            if (!currentPhone || !currentCustomerData) return;
            [ui.displayTotal, ui.displayUsed, ui.displayBalance].forEach(el => {
                el.style.transform = 'scale(1.2)';
                setTimeout(() => el.style.transform = 'scale(1)', 200);
                el.style.transition = 'transform 0.2s ease';
            });
            ui.displayTotal.innerText = currentCustomerData.total;
            ui.displayUsed.innerText = currentCustomerData.used;
            ui.displayBalance.innerText = currentCustomerData.balance;
        }

        function resetCurrentCustomer() {
            currentPhone = null;
            currentCustomerData = null;
            ui.phoneInput.value = '';
            ui.nameInput.value = '';
            ui.addPointInput.value = '1';
            ui.displayTotal.innerText = '0';
            ui.displayUsed.innerText = '0';
            ui.displayBalance.innerText = '0';
            ui.statsSection.classList.add('opacity-50', 'pointer-events-none');
            ui.actionSection.classList.add('opacity-50', 'pointer-events-none');
        }

        window.showCustomerList = function() {
            ui.appScreen.classList.add('hidden');
            ui.listScreen.classList.remove('hidden');
            ui.sortSelect.value = "totalDesc";
            fetchAndRenderList("totalDesc");
        };

        window.hideCustomerList = function() {
            ui.listScreen.classList.add('hidden');
            ui.appScreen.classList.remove('hidden');
        };

        window.sortAndRenderList = function() {
            fetchAndRenderList(ui.sortSelect.value);
        };

        async function fetchAndRenderList(sortVal) {
            ui.customerListContent.innerHTML = '<div class="flex flex-col items-center justify-center mt-10 text-gray-500"><i class="fa-solid fa-spinner fa-spin text-3xl text-[#ff6700] mb-4"></i><p class="font-medium">စာရင်းဆွဲယူနေပါသည်...</p></div>';
            
            let orderField = "total";
            let orderDir = "desc";

            if (sortVal === 'totalDesc') { orderField = "total"; orderDir = "desc"; }
            else if (sortVal === 'balanceDesc') { orderField = "balance"; orderDir = "desc"; }
            else if (sortVal === 'noAsc') { orderField = "no"; orderDir = "asc"; }
            else if (sortVal === 'noDesc') { orderField = "no"; orderDir = "desc"; }
            else if (sortVal === 'nameAsc') { orderField = "name"; orderDir = "asc"; }

            try {
                const q = query(collection(db, "customers"), orderBy(orderField, orderDir), limit(50));
                const querySnapshot = await getDocs(q);
                
                let sorted = [];
                querySnapshot.forEach((doc) => {
                    sorted.push(doc.data());
                });

                ui.customerListContent.innerHTML = '';
                ui.customerListContent.innerHTML += `<div class="bg-[#ffd400]/20 text-[#d95800] text-xs font-semibold text-center py-2.5 rounded-xl border border-[#ffd400]/50 mb-4 shadow-sm flex justify-center items-center gap-2"><i class="fa-solid fa-bolt"></i> ထိပ်ဆုံးစာရင်း (၅၀) ကိုသာ ပြသထားပါသည်။</div>`;

                if (sorted.length === 0) {
                    ui.customerListContent.innerHTML += '<div class="text-center text-gray-500 mt-10">မှတ်တမ်း မရှိသေးပါ။</div>';
                    return;
                }

                sorted.forEach((c, index) => {
                    const rankBadge = sortVal === 'totalDesc' && index < 3 
                                        ? `<i class="fa-solid fa-crown text-[#ff6700] ml-1"></i>` : '';
                    
                    const card = `
                    <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm flex flex-col relative overflow-hidden transition-all hover:shadow-md">
                        ${index < 3 && sortVal === 'totalDesc' ? '<div class="absolute top-0 left-0 w-1.5 h-full burger-gradient"></div>' : ''}
                        
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <span class="font-bold text-gray-800 text-lg">${index + 1}. ${c.name || 'Customer'} ${rankBadge}</span>
                                <div class="text-sm text-gray-500 font-medium mt-0.5"><i class="fa-solid fa-phone text-xs mr-1 text-gray-400"></i> ${c.phone}</div>
                            </div>
                            <span class="text-xs bg-gray-100 text-gray-600 px-2.5 py-1.5 rounded-lg font-bold border border-gray-200">
                                No. ${c.no || '-'}
                            </span>
                        </div>
                        
                        <div class="grid grid-cols-3 gap-2 text-center text-xs mb-3">
                            <div class="bg-blue-50 border border-blue-100 rounded-xl py-2 flex flex-col justify-center">
                                <span class="text-blue-600 font-semibold mb-0.5 text-[10px]">စုစုပေါင်း</span>
                                <span class="text-gray-800 font-black text-sm">${c.total || 0}</span>
                            </div>
                            <div class="bg-gray-50 border border-gray-200 rounded-xl py-2 flex flex-col justify-center">
                                <span class="text-gray-600 font-semibold mb-0.5 text-[10px]">သုံးပြီး</span>
                                <span class="text-gray-800 font-black text-sm">${c.used || 0}</span>
                            </div>
                            <div class="bg-green-50 border border-green-200 rounded-xl py-2 flex flex-col justify-center">
                                <span class="text-green-700 font-semibold mb-0.5 text-[10px]">လက်ကျန်</span>
                                <span class="text-green-800 font-black text-sm">${c.balance || 0}</span>
                            </div>
                        </div>
                        
                        <div class="flex justify-between text-[10px] text-gray-400 font-medium bg-gray-50/50 p-2 rounded-lg">
                            <span><i class="fa-solid fa-calendar-days mr-1"></i> ${c.joined_date || '-'}</span>
                            <span><i class="fa-solid fa-store mr-1"></i> ${c.last_visited_branch || c.registered_branch || '-'}</span>
                        </div>
                    </div>`;
                    ui.customerListContent.innerHTML += card;
                });

            } catch (error) {
                console.error("Fetch List Error:", error);
                ui.customerListContent.innerHTML = '<div class="text-center text-red-500 mt-10 bg-red-50 p-4 rounded-xl border border-red-100"><i class="fa-solid fa-triangle-exclamation text-2xl mb-2"></i><br>စာရင်းဆွဲယူ၍ မရပါ။ စနစ်ချိတ်ဆက်မှု ပြဿနာရှိပါသည်။</div>';
            }
        }

        window.showTransactions = function() {
            if(!isAdmin) return;
            ui.appScreen.classList.add('hidden');
            ui.transactionScreen.classList.remove('hidden');
            fetchAndRenderTransactions();
        };

        window.hideTransactions = function() {
            ui.transactionScreen.classList.add('hidden');
            ui.appScreen.classList.remove('hidden');
        };

        async function fetchAndRenderTransactions() {
            ui.transactionListContent.innerHTML = '<div class="flex flex-col items-center justify-center mt-10 text-gray-500"><i class="fa-solid fa-spinner fa-spin text-3xl text-[#ff6700] mb-4"></i><p class="font-medium">မှတ်တမ်းများ ဆွဲယူနေပါသည်...</p></div>';
            
            try {
                const q = query(collection(db, "transactions"), orderBy("timestamp", "desc"), limit(50));
                const querySnapshot = await getDocs(q);
                
                ui.transactionListContent.innerHTML = '';
                
                if (querySnapshot.empty) {
                    ui.transactionListContent.innerHTML = '<div class="text-center text-gray-500 mt-10">မှတ်တမ်း မရှိသေးပါ။</div>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const t = docSnap.data();
                    const isAdd = t.action === "ADD";
                    
                    const card = `
                    <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm flex flex-col relative overflow-hidden transition-all hover:shadow-md">
                        <div class="absolute left-0 top-0 w-1.5 h-full ${isAdd ? 'bg-green-500' : 'bg-red-500'}"></div>
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <span class="font-bold text-gray-800">${t.customer_name || 'Customer'}</span>
                                <div class="text-xs text-gray-500 font-medium mt-0.5"><i class="fa-solid fa-phone text-gray-400 mr-1"></i> ${t.phone}</div>
                            </div>
                            <span class="text-sm font-black ${isAdd ? 'text-green-600' : 'text-red-600'} bg-${isAdd ? 'green' : 'red'}-50 px-2 py-1 rounded-lg">
                                ${isAdd ? '+' : '-'}${t.points} Pts
                            </span>
                        </div>
                        <div class="flex justify-between items-center text-[10px] text-gray-500 font-medium bg-gray-50 p-2 rounded-lg mt-1">
                            <span class="text-gray-700 font-bold"><i class="fa-solid fa-store mr-1"></i> ${t.branch}</span>
                            <span><i class="fa-solid fa-clock mr-1"></i> ${t.date || '-'}</span>
                        </div>
                    </div>`;
                    ui.transactionListContent.innerHTML += card;
                });

            } catch (error) {
                console.error("Fetch Transactions Error:", error);
                ui.transactionListContent.innerHTML = '<div class="text-center text-red-500 mt-10 bg-red-50 p-4 rounded-xl border border-red-100"><i class="fa-solid fa-triangle-exclamation text-2xl mb-2"></i><br>မှတ်တမ်းများ ဆွဲယူ၍ မရပါ။ စနစ်ချိတ်ဆက်မှု ပြဿနာရှိပါသည်။</div>';
            }
        }

        ui.phoneInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') loadCustomer(); });
        ui.nameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') loadCustomer(); });

    </script>
</body>
</html>
