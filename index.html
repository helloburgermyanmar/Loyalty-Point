<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Burger | Point System</title>
    
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SweetAlert2 for beautiful popups -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Font Awesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        .burger-gradient {
            background: linear-gradient(135deg, #ff6700 0%, #d95800 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        /* Custom Chrome Scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        /* Shake animation for wrong passcode */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }
        .shake-animation {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- 1. Passcode Screen -->
    <div id="loginScreen" class="w-full max-w-sm glass-card rounded-3xl p-8 flex flex-col items-center justify-center transition-all duration-300">
        <div class="w-20 h-20 bg-[#ffd400] rounded-full flex items-center justify-center mb-6 shadow-lg shadow-[#ffd400]/40">
            <i class="fa-solid fa-burger text-4xl text-[#ff6700]"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-800 mb-1">Hello Burger</h1>
        <p class="text-sm text-gray-500 mb-8">Staff Portal - Point System</p>
        
        <div class="w-full relative">
            <i class="fa-solid fa-lock absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
            <input type="password" id="passcodeInput" placeholder="Enter Passcode" 
                   class="w-full bg-gray-100 text-gray-800 font-bold text-center rounded-xl py-4 pl-10 pr-4 outline-none focus:ring-2 focus:ring-[#ff6700] transition-all text-xl"
                   pattern="[0-9]*" inputmode="numeric">
        </div>
        
        <button onclick="checkPasscode()" class="w-full mt-4 burger-gradient text-white font-bold rounded-xl py-4 hover:shadow-lg hover:shadow-[#ff6700]/30 transition-all active:scale-95">
            LOGIN
        </button>
    </div>

    <!-- 2. Main App Screen (Hidden by default) -->
    <div id="appScreen" class="hidden w-full max-w-md h-[90vh] md:h-auto flex flex-col glass-card rounded-3xl overflow-hidden shadow-2xl relative">
        
        <!-- Header -->
        <div class="burger-gradient p-5 flex justify-between items-center text-white rounded-b-3xl shadow-md z-10">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-burger text-xl text-[#ff6700]"></i>
                </div>
                <div>
                    <h2 class="font-bold text-lg leading-tight">Loyalty Program</h2>
                    <p class="text-xs text-[#ffd400] font-medium">Hello Burger</p>
                </div>
            </div>
            <button onclick="logout()" class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center hover:bg-white/30 active:scale-90 transition-all">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </div>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto p-5 flex flex-col gap-6">
            
            <!-- Customer Search / Info Input -->
            <div class="bg-gray-50 rounded-2xl p-4 border border-gray-100 shadow-inner">
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Customer Details</label>
                
                <div class="space-y-3">
                    <div class="relative">
                        <i class="fa-solid fa-phone absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input type="tel" id="phoneInput" placeholder="09xxxxxxxxx" 
                               class="w-full bg-white border border-gray-200 rounded-xl py-3 pl-10 pr-4 outline-none focus:border-[#ff6700] focus:ring-1 focus:ring-[#ff6700] transition-all font-semibold text-gray-800">
                    </div>
                    
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="nameInput" placeholder="Customer Name (Optional)" 
                               class="w-full bg-white border border-gray-200 rounded-xl py-3 pl-10 pr-4 outline-none focus:border-[#ff6700] focus:ring-1 focus:ring-[#ff6700] transition-all text-gray-800">
                    </div>
                    
                    <button onclick="loadCustomer()" class="w-full bg-gray-800 text-white font-semibold rounded-xl py-3 hover:bg-gray-700 active:scale-95 transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-magnifying-glass"></i> Check / Register
                    </button>
                </div>
            </div>

            <!-- Stats Dashboard (Read-Only) -->
            <div id="statsSection" class="opacity-50 pointer-events-none transition-opacity duration-300">
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Points Record (Read Only)</label>
                <div class="grid grid-cols-3 gap-3">
                    <!-- Total Points -->
                    <div class="bg-blue-50 border border-blue-100 rounded-2xl p-3 text-center flex flex-col justify-center">
                        <span class="text-xs font-semibold text-blue-600 mb-1">စုစုပေါင်း</span>
                        <span id="displayTotal" class="text-2xl font-black text-gray-800">0</span>
                    </div>
                    <!-- Used Points -->
                    <div class="bg-gray-50 border border-gray-200 rounded-2xl p-3 text-center flex flex-col justify-center">
                        <span class="text-xs font-semibold text-gray-600 mb-1">သုံးပြီး</span>
                        <span id="displayUsed" class="text-2xl font-black text-gray-800">0</span>
                    </div>
                    <!-- Balance Points (Highlight) -->
                    <div class="bg-[#ffd400]/10 border border-[#ffd400] rounded-2xl p-3 text-center shadow-sm flex flex-col justify-center relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-1 bg-[#ffd400]"></div>
                        <span class="text-xs font-bold text-yellow-700 mb-1">လက်ကျန်</span>
                        <span id="displayBalance" class="text-3xl font-black text-[#ff6700]">0</span>
                    </div>
                </div>
            </div>

            <!-- Action Options -->
            <div id="actionSection" class="opacity-50 pointer-events-none transition-opacity duration-300 pb-4">
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Actions</label>
                
                <div class="space-y-4">
                    <!-- Option 1: Add Points -->
                    <div class="flex gap-2 p-3 bg-white border border-gray-200 rounded-2xl items-center shadow-sm">
                        <div class="w-12 h-12 bg-green-100 rounded-xl flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-plus text-green-600 text-xl"></i>
                        </div>
                        <div class="flex-1">
                            <input type="number" id="addPointInput" placeholder="Qty" value="1" min="1"
                                   class="w-full bg-gray-100 border-none rounded-lg py-2 px-3 text-center font-bold text-lg outline-none focus:ring-2 focus:ring-green-500">
                        </div>
                        <button onclick="addPoints()" class="bg-green-600 text-white font-bold py-3 px-4 rounded-xl hover:bg-green-700 active:scale-95 transition-all whitespace-nowrap">
                            Point ပေါင်းမည်
                        </button>
                    </div>

                    <!-- Option 2: Use Points -->
                    <button onclick="usePoints()" class="w-full relative overflow-hidden group burger-gradient p-4 rounded-2xl shadow-lg hover:shadow-[#ff6700]/30 active:scale-95 transition-all text-left">
                        <div class="absolute right-[-10px] bottom-[-10px] opacity-20 transform group-hover:scale-110 transition-transform">
                            <i class="fa-solid fa-burger text-8xl text-white"></i>
                        </div>
                        <div class="relative z-10 flex items-center justify-between">
                            <div>
                                <h3 class="text-white font-bold text-lg">Cheese Burger ထုတ်မည်</h3>
                                <p class="text-[#ffd400] text-sm font-medium mt-1"><i class="fa-solid fa-circle-exclamation"></i> 10 Points လိုအပ်ပါသည်</p>
                            </div>
                            <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center text-white backdrop-blur-sm">
                                <i class="fa-solid fa-arrow-right"></i>
                            </div>
                        </div>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // --- STREAMING_CHUNK: System Configurations ---
        const CONFIG = {
            PASSCODE: "1111", // Passcode ပြောင်းရန် ဤနေရာတွင် ပြင်ပါ။
            REWARD_COST: 10,   // Cheese Burger ရရန် လိုအပ်သော Point
            API_URL: "https://script.google.com/macros/s/AKfycbwhbDs9Dx7doWvbAErKXqThm4j_f7IbFqJ7ltkACHCnDAQXB24MBXerAHZEIUU-6HNUdQ/exec" // 👈 အရေးကြီး: Google Script ၏ Web App Link အစစ်ကို ဤနေရာတွင် အစားထိုးပါ
        };

        // --- STATE VARIABLES ---
        let currentPhone = null;
        let currentCustomerData = null; // Store cloud data

        // --- DOM ELEMENTS ---
        const ui = {
            loginScreen: document.getElementById('loginScreen'),
            appScreen: document.getElementById('appScreen'),
            passcodeInput: document.getElementById('passcodeInput'),
            phoneInput: document.getElementById('phoneInput'),
            nameInput: document.getElementById('nameInput'),
            statsSection: document.getElementById('statsSection'),
            actionSection: document.getElementById('actionSection'),
            displayTotal: document.getElementById('displayTotal'),
            displayUsed: document.getElementById('displayUsed'),
            displayBalance: document.getElementById('displayBalance'),
            addPointInput: document.getElementById('addPointInput')
        };

        // --- STREAMING_CHUNK: Authentication ---
        
        ui.passcodeInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkPasscode();
        });

        function checkPasscode() {
            if (ui.passcodeInput.value === CONFIG.PASSCODE) {
                ui.loginScreen.classList.add('hidden');
                ui.appScreen.classList.remove('hidden');
                ui.passcodeInput.value = '';
                ui.phoneInput.focus();
            } else {
                ui.loginScreen.classList.add('shake-animation');
                setTimeout(() => ui.loginScreen.classList.remove('shake-animation'), 400);
                Swal.fire({
                    icon: 'error',
                    title: 'မှားယွင်းနေပါသည်',
                    text: 'Passcode မှန်ကန်မှုမရှိပါ။ ပြန်လည်ကြိုးစားပါ။',
                    confirmButtonColor: '#ff6700'
                });
                ui.passcodeInput.value = '';
            }
        }

        function logout() {
            resetCurrentCustomer();
            ui.appScreen.classList.add('hidden');
            ui.loginScreen.classList.remove('hidden');
        }

        // --- STREAMING_CHUNK: Cloud Database Operations ---

        // Helper function to send data to Google Sheet
        async function saveToDatabase(customerData, successMessage, customIcon = 'success', customHtml = null) {
            Swal.fire({ title: 'Processing...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
            
            try {
                const response = await fetch(CONFIG.API_URL, {
                    method: 'POST',
                    // Using text/plain to avoid CORS preflight errors with Google Apps Script
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'update_or_create', ...customerData })
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    if (customHtml) {
                        Swal.fire({ icon: customIcon, title: 'အောင်မြင်ပါသည်', text: successMessage, confirmButtonColor: '#16a34a', backdrop: customHtml });
                    } else if (successMessage) {
                        Swal.fire({ icon: customIcon, title: 'အောင်မြင်ပါသည်', text: successMessage, timer: 1500, showConfirmButton: false });
                    } else {
                        Swal.close();
                    }
                    return true;
                } else {
                    throw new Error("API returned failure");
                }
            } catch (error) {
                 console.error(error);
                 Swal.fire({ icon: 'error', title: 'Connection Error', text: 'အင်တာနက်ချိတ်ဆက်မှု မကောင်းပါ။', confirmButtonColor: '#ff6700' });
                 return false;
            }
        }

        // Fetch user data from Google Sheet
        async function loadCustomer() {
            const phone = ui.phoneInput.value.trim();
            const name = ui.nameInput.value.trim();

            if (!phone) {
                Swal.fire({ icon: 'warning', title: 'လိုအပ်ပါသည်', text: 'ဖုန်းနံပါတ် ရိုက်ထည့်ပါ။', confirmButtonColor: '#ff6700' });
                return;
            }

            if (CONFIG.API_URL === "YOUR_WEB_APP_URL_HERE") {
                 Swal.fire({ icon: 'error', title: 'API မချိတ်ရသေးပါ', text: 'Code ထဲတွင် Google Script URL အစားထိုးရန် ကျန်နေပါသေးသည်။' });
                 return;
            }

            Swal.fire({ title: 'ရှာဖွေနေပါသည်...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

            try {
                const response = await fetch(`${CONFIG.API_URL}?phone=${phone}`);
                const data = await response.json();
                
                if (data.status === 'found') {
                    // Existing customer
                    currentCustomerData = { 
                        phone: data.phone, 
                        name: data.name, 
                        total: parseInt(data.total), 
                        used: parseInt(data.used), 
                        balance: parseInt(data.balance) 
                    };
                    ui.nameInput.value = data.name; // Show stored name
                    Swal.close();
                } else {
                    // Create new customer via API
                    currentCustomerData = { phone: phone, name: name || "Customer", total: 0, used: 0, balance: 0 };
                    await saveToDatabase(currentCustomerData, 'Customer အသစ်အတွက် မှတ်တမ်းတင်ပြီးပါပြီ။');
                    ui.nameInput.value = currentCustomerData.name;
                }

                currentPhone = phone;
                updateDashboard();
                ui.statsSection.classList.remove('opacity-50', 'pointer-events-none');
                ui.actionSection.classList.remove('opacity-50', 'pointer-events-none');

            } catch (error) {
                Swal.fire({ icon: 'error', title: 'Connection Error', text: 'အင်တာနက်ချိတ်ဆက်မှု စစ်ဆေးပါ။ (VPN ဖွင့်ထားပါက ခဏပိတ်ထားပါ)' });
            }
        }

        function updateDashboard() {
            if (!currentPhone || !currentCustomerData) return;
            
            // Animate numbers
            [ui.displayTotal, ui.displayUsed, ui.displayBalance].forEach(el => {
                el.style.transform = 'scale(1.2)';
                setTimeout(() => el.style.transform = 'scale(1)', 200);
                el.style.transition = 'transform 0.2s ease';
            });

            ui.displayTotal.innerText = currentCustomerData.total;
            ui.displayUsed.innerText = currentCustomerData.used;
            ui.displayBalance.innerText = currentCustomerData.balance;
        }

        function resetCurrentCustomer() {
            currentPhone = null;
            currentCustomerData = null;
            ui.phoneInput.value = '';
            ui.nameInput.value = '';
            ui.addPointInput.value = '1';
            
            ui.displayTotal.innerText = '0';
            ui.displayUsed.innerText = '0';
            ui.displayBalance.innerText = '0';
            
            ui.statsSection.classList.add('opacity-50', 'pointer-events-none');
            ui.actionSection.classList.add('opacity-50', 'pointer-events-none');
        }

        // --- STREAMING_CHUNK: Actions (Add/Use Points) ---

        async function addPoints() {
            if (!currentPhone || !currentCustomerData) return;
            
            const pointsToAdd = parseInt(ui.addPointInput.value);
            if (isNaN(pointsToAdd) || pointsToAdd <= 0) {
                Swal.fire({ icon: 'warning', title: 'အမှား', text: 'Point အရေအတွက် မှန်ကန်စွာရိုက်ထည့်ပါ။', confirmButtonColor: '#ff6700' });
                return;
            }

            // Copy old data, calculate new values, then save to Cloud
            const updatedData = { ...currentCustomerData };
            updatedData.total += pointsToAdd;
            updatedData.balance += pointsToAdd;
            
            const success = await saveToDatabase(updatedData, `+${pointsToAdd} Point(s) ကိုအောင်မြင်စွာထည့်သွင်းပြီးပါပြီ။`);
            
            if (success) {
                currentCustomerData = updatedData; // Update local state only if cloud save is successful
                updateDashboard();
                ui.addPointInput.value = '1';
            }
        }

        function usePoints() {
            if (!currentPhone || !currentCustomerData) return;
            
            if (currentCustomerData.balance < CONFIG.REWARD_COST) {
                Swal.fire({
                    icon: 'error',
                    title: 'Point မလောက်ပါ',
                    text: `Cheese Burger ထုတ်ရန် Point (၁၀) ခု လိုအပ်ပါသည်။ (လက်ကျန်: ${currentCustomerData.balance})`,
                    confirmButtonColor: '#ff6700'
                });
                return;
            }

            Swal.fire({
                title: 'Cheese Burger ထုတ်မည်',
                text: "10 Points နှုတ်မည်မှာ သေချာပါသလား?",
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#ff6700',
                cancelButtonColor: '#6b7280',
                confirmButtonText: 'သေချာပါသည်',
                cancelButtonText: 'မလုပ်ပါ'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    
                    const updatedData = { ...currentCustomerData };
                    updatedData.balance -= CONFIG.REWARD_COST;
                    updatedData.used += CONFIG.REWARD_COST;

                    // Deduct from Cloud DB
                    const success = await saveToDatabase(
                        updatedData, 
                        'Cheese Burger (1) ခု Free ပေးလိုက်ပါ။', 
                        'success', 
                        `rgba(0,0,0,0.8) url("https://media.giphy.com/media/xTiTnqUxyWbsAXq7Ju/giphy.gif") left top no-repeat`
                    );

                    if (success) {
                        currentCustomerData = updatedData;
                        updateDashboard();
                    }
                }
            });
        }

        // Auto load if pressing enter on fields
        ui.phoneInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') loadCustomer();
        });
        ui.nameInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') loadCustomer();
        });

    </script>
</body>
</html>
